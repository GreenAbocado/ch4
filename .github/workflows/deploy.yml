name: CI/CD Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
    paths-ignore: # 문서화 작업의 경우 불필요하게 도커 이미지 빌드/푸시(deploy job) 진행X
      - '**.md'
      - 'img/**'
  pull_request:
    branches: [main]
    # 브랜치룰에 PR시 CI(buid job) 통과 필수 설정 - 모든 작업 build job 수행 필수

jobs:

  # 테스트 + 빌드 수행 (main PR, main push)
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read # 코드 체크아웃용

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle # 깃헙 캐시에서 의존성 라이브러리 가져옴 (빌드 속도 향상)

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar  # .jar 파일 생성 여부까지 확인

      - name: Upload jar  # jar 파일을 다른 job에서 사용하기 위해 업로드
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar  # 해당 경로에 jar파일 업로드 (build.gradle에서 plain은 빌드 되지 않도록 설정)


  # build job + ECR 업로드 + SSM 이미지 태그 put + ASG 인스턴스 리프레시 (main push일 때만)
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC 토큰 발급용. 이후 AWS에서 검증 후 임시자격증명 발급
      contents: read # 코드 체크아웃용 (Dockerfile 필요)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/libs  # 해당 경로에 jar 파일 다운로드 (Dockerfile COPY 경로와 동기화 필수)

      - name: Get Short SHA
        run: echo "IMAGE_TAG=$(echo ${{github.sha}} | cut -c1-7)" >> $GITHUB_ENV

      # OIDC를 통해 임시자격증명 취득
      - name: Configure AWS Credential
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION}}

      # Docker 로그인 (임시자격증명으로 로그인 토큰 요청 후 도커 로그인)
      - name: Login to Amazon ECR Private
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        run: |
          IMAGE_REFERENCE=${{vars.ECR_URI}}:$IMAGE_TAG
          docker build --platform linux/arm64 -t $IMAGE_REFERENCE .
          docker push $IMAGE_REFERENCE

      # SSM Parameter Store에 이미지 태그 저장 (버전별로 저장 가능)
      - name: Save Image Tag To SSM
        run: |
          aws ssm put-parameter \
            --name ${{vars.SSM_TAG_PARAMETER_NAME}} \
            --value $IMAGE_TAG \
            --type String \
            --overwrite
      
      # ASG 인스턴스 새로고침
      - name: Start Instance Refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
          --auto-scaling-group-name ${{vars.ASG_NAME}} \
          --preferences '{"MinHealthyPercentage": 100, "InstanceWarmup": 120}' \
          --query 'InstanceRefreshId' \
          --output text)
          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_ENV

      # ASG 인스턴스 새로고침 상태 확인
      - name: Wait For Instance Refresh
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{vars.ASG_NAME}} \
              --instance-refresh-ids $refresh_id \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "시도 ${i}/40 - 상태: $STATUS"
            
            case $STATUS in
              Successful) echo "배포 완료"; exit 0 ;;
              Failed|Cancelled|RollbackInProgress|RollbackFailed|RollbackSuccessful)
                echo "배포 실패: $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "타임아웃"
          exit 1