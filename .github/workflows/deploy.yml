name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # 코드 체크아웃용

jobs:

  # 테스트 + 빌드 수행 (main PR, main push)
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle # 깃헙 캐시에서 의존성 라이브러리 가져옴 (빌드 속도 향상)

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar  # .jar 파일 생성 여부까지 확인

      - name: Upload jar  # jar 파일을 다른 job에서 사용하기 위해 업로드
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar  # 해당 경로에 jar파일 업로드 (build.gradle에서 plain은 빌드 되지 않도록 설정)


  # build job + DockerHub 업로드 (main push일 때만)
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/libs  # 해당 경로에 jar 파일 다운로드 (Dockerfile COPY 경로와 동기화 필수)


      # DockerHub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_SECRET_KEY}}


      - name: Build & Push Docker image
        run: |
          IMAGE_REFERENCE=${{vars.DOCKERHUB_USERNAME}}/${{vars.DOCKERHUB_REPOSITORY}}:$(echo ${{github.sha}} | cut -c1-7)
          docker build --platform linux/arm64 -t $IMAGE_REFERENCE .
          docker push $IMAGE_REFERENCE