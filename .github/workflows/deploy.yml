name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
    paths-ignore: # 문서화 작업의 경우 불필요하게 도커 이미지 빌드/푸시(deploy job) 진행X
      - '**.md'
      - 'img/**'
  pull_request:
    branches: [main]
    # 브랜치룰에 PR시 CI(buid job) 통과 필수 설정 - 모든 작업 build job 수행 필수

jobs:

  # 테스트 + 빌드 수행 (main PR, main push)
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read # 코드 체크아웃용

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle # 깃헙 캐시에서 의존성 라이브러리 가져옴 (빌드 속도 향상)

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar  # .jar 파일 생성 여부까지 확인

      - name: Upload jar  # jar 파일을 다른 job에서 사용하기 위해 업로드
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar  # 해당 경로에 jar파일 업로드 (build.gradle에서 plain은 빌드 되지 않도록 설정)


  # build job + DockerHub 업로드 (main push일 때만)
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC 토큰 발급용. 이후 AWS에서 검증 후 임시자격증명 발급
      contents: read # 코드 체크아웃용 (Dockerfile 필요)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/libs  # 해당 경로에 jar 파일 다운로드 (Dockerfile COPY 경로와 동기화 필수)

      # OIDC를 통해 임시자격증명 취득
      - name: Configure AWS Credential
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION}}

      # Docker 로그인 (임시자격증명으로 로그인 토큰 요청 후 도커 로그인)
      - name: Login to Amazon ECR Private
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        run: |
          IMAGE_REFERENCE=${{vars.ECR_URI}}:$(echo ${{github.sha}} | cut -c1-7)
          docker build --platform linux/arm64 -t $IMAGE_REFERENCE .
          docker push $IMAGE_REFERENCE

      # 이후 인스턴스 리프레쉬를 이용한 CD 워크 플로우 추가